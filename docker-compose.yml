services:
#   app:
#     build:
#       context: .
#       dockerfile: Dockerfile
#     container_name: smartlib-app
#     env_file: .env
#     environment:
#       # .env's DATABASE_URL/REDIS_URL/S3_ENDPOINT point at localhost, correct
#       # for host-mode `npm run dev` but wrong from inside this container --
#       # override with the compose service names on the shared network.
#       DATABASE_URL: postgresql://smartlib:password123@postgres:5432/library?schema=public
#       REDIS_URL: redis://redis:6379
#       S3_ENDPOINT: http://minio:9000
#     ports:
#       - '5000:5000'
#     depends_on:
#       - postgres
#       - redis
#       - minio
#     restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartlib-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: smartlib-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: smartlib
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: smartlib-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
  minio_data:
