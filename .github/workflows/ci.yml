name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Setup Environment
      run: cp .env.example .env

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint Code
      run: npm run lint
      continue-on-error: true

    - name: Build TypeScript
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      run: echo "Deploying to production server..."
      # Add your actual deployment script here (e.g., SSH to VPS, pull docker image, etc.)
