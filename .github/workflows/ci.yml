name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: smartlib
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartlib -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Setup Environment
      run: cp .env.example .env

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Apply Prisma Migrations
      run: npx prisma migrate deploy

    - name: Lint Code
      run: npm run lint

    - name: Build TypeScript
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm test

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      working-directory: client
      run: npm ci

    - name: Build Next.js app
      working-directory: client
      run: npm run build
